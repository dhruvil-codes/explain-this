<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: Georgia, serif; margin: 0; padding: 16px; }
  h2 { font-size: 20px; margin: 0 0 4px; font-weight: normal; }
  p { font-size: 15px; line-height: 1.5; }
  ol { padding: 0; list-style: none; margin: 12px 0; }
  li { border: 1px solid #e0dacb; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; font-size: 15px; opacity: 0.45; }
  li.on { opacity: 1; border-color: #C2410C; background: #FCE9DC; }
  li b { display: block; font-weight: normal; font-style: italic; }
  .bar { display: flex; gap: 8px; margin-top: 12px; }
  button.nav { font-family: inherit; font-size: 16px; padding: 10px 18px; border-radius: 999px; border: 1px solid #C2410C; background: #C2410C; color: #fff; cursor: pointer; }
  button.nav[disabled] { opacity: 0.4; }
</style>
</head>
<body>
<h2>From your wish to a running app</h2>
<p>Press Next to walk one request across the cluster, one part at a time.</p>
<ol id="steps"></ol>
<div class="bar">
<button class="nav" id="back">Back</button>
<button class="nav" id="next">Next</button>
</div>
<script>
var steps = [
  ["State your wish", "You ask for three copies of your website in a short file."],
  ["Plan is recorded", "The API server checks the request and remembers it safely."],
  ["Work finds a home", "The scheduler picks a machine with enough free room."],
  ["Controllers keep watch", "Caretaker loops compare reality with the plan, day and night."],
  ["Programs start running", "Each machine starts its copies and reports back."],
  ["Visitors arrive safely", "One steady address guides visitors to a healthy copy."]
];
var i = 0;
var list = document.getElementById("steps");
function render() {
  list.innerHTML = "";
  steps.forEach(function (s, k) {
    var li = document.createElement("li");
    if (k <= i) li.className = "on";
    li.innerHTML = "<b>" + (k + 1) + ". " + s[0] + "</b>" + s[1];
    list.appendChild(li);
  });
  document.getElementById("back").disabled = i === 0;
  document.getElementById("next").disabled = i === steps.length - 1;
}
document.getElementById("back").onclick = function () { if (i > 0) i--; render(); };
document.getElementById("next").onclick = function () { if (i < steps.length - 1) i++; render(); };
render();
</script>
</body>
</html>
